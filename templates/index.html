<!DOCTYPE html>
<html lang="mn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Сургуулийн Ухаалаг АИ Самбар</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none !important;
        }

        body {
            background: linear-gradient(135deg, #050b14, #0a1726, #0f2338);
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 20px;
            overflow-x: hidden;
            position: relative;
        }

        #bgCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            pointer-events: none;
        }

        header {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            max-width: 900px;
            position: relative;
            z-index: 1;
        }

        .header-title-box {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .school-logo {
            width: 48px;
            height: 48px;
            object-fit: contain;
            filter: drop-shadow(0 0 10px rgba(0, 242, 254, 0.6));
        }

        h1 {
            font-size: 1.8rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            background: linear-gradient(90deg, #ffffff, #00f2fe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .admin-btn {
            position: absolute;
            right: 0;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(0, 242, 254, 0.3);
            color: #fff;
            padding: 8px 18px;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s;
            backdrop-filter: blur(5px);
        }

        .admin-btn:hover {
            background: rgba(0, 242, 254, 0.2);
            border-color: #00f2fe;
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.4);
        }

        main {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            max-width: 800px;
            flex: 1;
            position: relative;
            z-index: 10;
        }

        /* 🚀 ULTRA-FUTURISTIC HIGH-TECH AI AVATAR */
        .orb-container {
            width: 300px;
            height: 300px;
            margin: 10px auto;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            touch-action: none;
            -webkit-tap-highlight-color: transparent;
            z-index: 20;
        }

        .hud-ring {
            position: absolute;
            border-radius: 50%;
            pointer-events: none;
            transition: all 0.5s ease;
        }

        .hud-ring.outer-ring {
            width: 290px;
            height: 290px;
            border: 2px dashed rgba(0, 242, 254, 0.35);
            animation: rotateClockwise 18s linear infinite;
        }

        .hud-ring.inner-ring {
            width: 260px;
            height: 260px;
            border: 1px solid rgba(127, 0, 255, 0.3);
            border-top: 3px solid rgba(0, 242, 254, 0.8);
            border-bottom: 3px solid rgba(0, 242, 254, 0.8);
            animation: rotateCounterClockwise 12s linear infinite;
        }

        @keyframes rotateClockwise {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes rotateCounterClockwise {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(-360deg); }
        }

        .ai-head {
            width: 220px;
            height: 220px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, rgba(15, 35, 60, 0.85), rgba(5, 12, 22, 0.95));
            border: 2px solid rgba(0, 242, 254, 0.6);
            box-shadow: 0 0 30px rgba(0, 242, 254, 0.3), inset 0 0 20px rgba(0, 242, 254, 0.2);
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 22px;
            backdrop-filter: blur(12px);
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            animation: floatHead 4s infinite ease-in-out;
        }

        @keyframes floatHead {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }

        .side-node {
            position: absolute;
            top: 50%;
            width: 14px;
            height: 48px;
            background: linear-gradient(180deg, #00f2fe, #7f00ff);
            border-radius: 8px;
            transform: translateY(-50%);
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.5);
            transition: all 0.4s ease;
        }

        .side-node.node-left { left: -18px; border-radius: 10px 2px 2px 10px; }
        .side-node.node-right { right: -18px; border-radius: 2px 10px 10px 2px; }

        .pulse-ring {
            position: absolute;
            top: 50%; left: 50%;
            width: 100%; height: 100%;
            border-radius: 8px;
            border: 1px solid #00f2fe;
            transform: translate(-50%, -50%);
            opacity: 0;
        }

        .eyes-container {
            display: flex;
            gap: 36px;
            align-items: center;
            z-index: 2;
        }

        .eye {
            width: 44px;
            height: 44px;
            background: radial-gradient(circle, #ffffff 10%, #00f2fe 45%, rgba(0, 82, 212, 0.8) 100%);
            border-radius: 50%;
            box-shadow: 0 0 20px #00f2fe, 0 0 35px rgba(0, 242, 254, 0.5);
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            animation: blinkEye 4.5s infinite ease-in-out;
            transition: all 0.3s ease;
        }

        .eye .pupil {
            width: 14px;
            height: 14px;
            background: #ffffff;
            border-radius: 50%;
            box-shadow: 0 0 10px #ffffff;
            transition: transform 0.2s ease;
        }

        @keyframes blinkEye {
            0%, 94%, 100% { transform: scaleY(1); }
            97% { transform: scaleY(0.06); }
        }

        .mouth-visualizer {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            height: 30px;
            width: 110px;
            z-index: 2;
        }

        .v-bar {
            width: 4px;
            height: 6px;
            background: linear-gradient(180deg, #00f2fe, #3a7bd5);
            border-radius: 3px;
            box-shadow: 0 0 8px #00f2fe;
            transition: height 0.15s ease, background 0.3s ease;
        }

        .orb-container.recording .ai-head {
            border-color: #ff2a5f;
            box-shadow: 0 0 50px rgba(255, 42, 95, 0.6), inset 0 0 25px rgba(255, 42, 95, 0.3);
        }

        .orb-container.recording .outer-ring {
            border-color: rgba(255, 42, 95, 0.6);
            animation-duration: 6s;
        }

        .orb-container.recording .inner-ring {
            border-top-color: #ff2a5f;
            border-bottom-color: #ff2a5f;
            animation-duration: 4s;
        }

        .orb-container.recording .side-node {
            background: linear-gradient(180deg, #ff2a5f, #ff758c);
            height: 65px;
            box-shadow: 0 0 25px #ff2a5f;
        }

        .orb-container.recording .pulse-ring {
            animation: nodePulse 1.2s infinite ease-out;
        }

        @keyframes nodePulse {
            0% { transform: translate(-50%, -50%) scale(1); opacity: 0.8; }
            100% { transform: translate(-50%, -50%) scale(2.2); opacity: 0; }
        }

        .orb-container.recording .eye {
            background: radial-gradient(circle, #ffffff 10%, #ff2a5f 50%, #b3002d 100%);
            box-shadow: 0 0 25px #ff2a5f;
            transform: scale(1.08);
        }

        .orb-container.recording .v-bar {
            background: linear-gradient(180deg, #ff2a5f, #ff758c);
            box-shadow: 0 0 8px #ff2a5f;
        }

        .orb-container.speaking .ai-head {
            border-color: #00f2fe;
            box-shadow: 0 0 65px rgba(0, 242, 254, 0.8);
            transform: scale(1.04);
        }

        .orb-container.speaking .eye {
            transform: scale(1.12);
            box-shadow: 0 0 30px #00f2fe, 0 0 50px rgba(0, 242, 254, 0.8);
        }

        .orb-container.speaking .v-bar {
            background: linear-gradient(180deg, #ffffff, #00f2fe);
            animation: waveActive 0.35s infinite alternate ease-in-out;
        }

        .orb-container.speaking .v-bar:nth-child(1) { animation-delay: 0.05s; }
        .orb-container.speaking .v-bar:nth-child(2) { animation-delay: 0.15s; }
        .orb-container.speaking .v-bar:nth-child(3) { animation-delay: 0.25s; }
        .orb-container.speaking .v-bar:nth-child(4) { animation-delay: 0.35s; }
        .orb-container.speaking .v-bar:nth-child(5) { animation-delay: 0.25s; }
        .orb-container.speaking .v-bar:nth-child(6) { animation-delay: 0.15s; }
        .orb-container.speaking .v-bar:nth-child(7) { animation-delay: 0.05s; }

        @keyframes waveActive {
            0% { height: 4px; }
            100% { height: 28px; }
        }

        .orb-container.offline .ai-head {
            border-color: #f59e0b;
            box-shadow: 0 0 30px rgba(245, 158, 11, 0.5);
        }
        .orb-container.offline .eye {
            background: radial-gradient(circle, #ffffff 10%, #f59e0b 50%, #b45309 100%);
            box-shadow: 0 0 20px #f59e0b;
        }

        .arrow-overlay {
            position: absolute;
            font-size: 6.5rem;
            color: #ffffff;
            text-shadow: 0 0 20px #00f2fe, 0 0 40px #00d2ff, 0 0 60px #3a7bd5;
            opacity: 0;
            transform: scale(0.5);
            transition: all 0.4s ease;
            pointer-events: none;
            z-index: 25;
        }

        .orb-container.show-arrow .ai-head,
        .orb-container.show-arrow .hud-ring {
            opacity: 0.2;
            transform: scale(0.85);
        }

        .orb-container.show-arrow .arrow-overlay {
            opacity: 1;
        }

        .status-text {
            font-size: 1.2rem;
            margin-top: 15px;
            text-align: center;
            color: #cbd5e1;
            min-height: 35px;
            font-weight: 500;
        }

        .key-badge {
            background: rgba(0, 242, 254, 0.15);
            padding: 4px 12px;
            border-radius: 6px;
            font-weight: bold;
            color: #00f2fe;
            border: 1px solid rgba(0, 242, 254, 0.4);
        }

        .chat-box {
            margin-top: 15px;
            width: 100%;
            background: rgba(10, 22, 38, 0.6);
            border-radius: 16px;
            padding: 20px;
            backdrop-filter: blur(12px);
            border: 1px solid rgba(0, 242, 254, 0.2);
            display: none;
            transition: opacity 0.5s ease;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
        }

        .question {
            font-size: 1.1rem;
            color: #38bdf8;
            margin-bottom: 10px;
        }

        .answer {
            font-size: 1.15rem;
            color: #ffffff;
            line-height: 1.6;
        }

        footer {
            width: 100%;
            max-width: 900px;
            background: rgba(10, 22, 38, 0.6);
            border-radius: 16px;
            padding: 14px 22px;
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            flex-direction: column;
            gap: 10px;
            position: relative;
            z-index: 10;
            margin-top: 15px;
        }

        .footer-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .time-date-box {
            display: flex;
            flex-direction: column;
        }

        .time-text {
            font-size: 1.5rem;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: 1px;
        }

        .date-text {
            font-size: 0.85rem;
            color: #94a3b8;
        }

        .ble-status-box {
            position: fixed;
            bottom: 15px;
            right: 20px;
            z-index: 100;
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(10, 22, 38, 0.85);
            padding: 8px 14px;
            border-radius: 20px;
            border: 1px solid rgba(0, 242, 254, 0.25);
            font-size: 0.85rem;
            color: #e2e8f0;
            backdrop-filter: blur(8px);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
        }

        .ble-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background-color: #ef4444;
            box-shadow: 0 0 8px rgba(239, 68, 68, 0.8);
            transition: all 0.4s ease;
        }

        .ble-dot.connected {
            background-color: #22c55e;
            box-shadow: 0 0 10px rgba(34, 197, 94, 0.9);
        }

        .weather-box {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .weather-icon {
            font-size: 2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: floatIcon 2.5s infinite ease-in-out;
        }

        .weather-info {
            display: flex;
            flex-direction: column;
            text-align: right;
        }

        .city-temp {
            font-size: 1.1rem;
            font-weight: 600;
            color: #38bdf8;
        }

        .weather-desc {
            font-size: 0.85rem;
            color: #cbd5e1;
        }

        .reminder-box {
            background: rgba(56, 189, 248, 0.08);
            border-left: 4px solid #38bdf8;
            padding: 10px 14px;
            border-radius: 6px;
            font-size: 1.15rem;
            color: #f1f5f9;
            display: flex;
            align-items: center;
            gap: 10px;
            overflow: hidden;
            position: relative;
        }

        .news-badge {
            background: #38bdf8;
            color: #0f172a;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 0.85rem;
            white-space: nowrap;
            flex-shrink: 0;
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.4);
        }

        .ticker-wrapper {
            flex: 1;
            overflow: hidden;
            white-space: nowrap;
            position: relative;
        }

        .ticker-text {
            display: inline-block;
            white-space: nowrap;
            padding-left: 100%;
            animation: marquee 55s linear infinite;
            font-size: 1.15rem;
            font-weight: 500;
            color: #ffffff;
        }

        @keyframes marquee {
            0% { transform: translateX(0); }
            100% { transform: translateX(-100%); }
        }

        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            justify-content: center;
            align-items: center;
            z-index: 10000;
            backdrop-filter: blur(8px);
        }

        .modal-content {
            background: #0f172a;
            padding: 30px;
            border-radius: 16px;
            width: 90%;
            max-width: 600px;
            border: 1px solid rgba(0, 242, 254, 0.3);
            box-shadow: 0 0 40px rgba(0, 242, 254, 0.2);
        }

        textarea {
            width: 100%;
            height: 220px;
            background: #070d19;
            color: #fff;
            border: 1px solid #1e293b;
            border-radius: 8px;
            padding: 12px;
            margin: 15px 0;
            resize: vertical;
            -webkit-user-select: text !important;
            user-select: text !important;
        }

        .btn-group {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }

        .btn {
            padding: 8px 18px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-weight: 600;
        }

        .btn-primary { background: #0284c7; color: white; }
        .btn-secondary { background: #475569; color: white; }
    </style>
</head>
<body oncontextmenu="return false;">

    <canvas id="bgCanvas"></canvas>

    <header>
        <div class="header-title-box">
            <img src="/static/logo.png" alt="Сургуулийн Лого" class="school-logo">
            <h1>Сургуулийн Ухаалаг Туслах</h1>
        </div>
        <button class="admin-btn" onclick="openAdmin()">⚙️ Тохиргоо</button>
    </header>

    <main>
        <!-- 🚀 HIGH-TECH SCI-FI AI AVATAR -->
        <div class="orb-container" id="orbContainer">
            <div class="hud-ring outer-ring"></div>
            <div class="hud-ring inner-ring"></div>
            <div class="ai-head">
                <div class="side-node node-left"><div class="pulse-ring"></div></div>
                <div class="side-node node-right"><div class="pulse-ring"></div></div>
                <div class="eyes-container">
                    <div class="eye"><div class="pupil"></div></div>
                    <div class="eye"><div class="pupil"></div></div>
                </div>
                <div class="mouth-visualizer">
                    <div class="v-bar"></div>
                    <div class="v-bar"></div>
                    <div class="v-bar"></div>
                    <div class="v-bar"></div>
                    <div class="v-bar"></div>
                    <div class="v-bar"></div>
                    <div class="v-bar"></div>
                </div>
            </div>
            <div class="arrow-overlay" id="arrowOverlay">➔</div>
        </div>

        <div class="status-text" id="statusText">
            Дэлгэц дээр эсвэл <span class="key-badge">SPACE</span> товчлуур дээр дарж яриарай
        </div>

        <div class="chat-box" id="chatBox">
            <div class="question" id="userQuestion"></div>
            <div class="answer" id="aiAnswer"></div>
        </div>
    </main>

    <footer>
        <div class="footer-top">
            <div class="time-date-box">
                <div class="time-text" id="timeDisplay">00:00:00</div>
                <div class="date-text" id="dateDisplay">----.--.--</div>
            </div>

            <div class="weather-box">
                <div class="weather-icon" id="weatherIcon">☀</div>
                <div class="weather-info">
                    <div class="city-temp">Зүүнхараа: <span id="weatherTemp">--°C</span></div>
                    <div class="weather-desc" id="weatherDesc">Уншиж байна...</div>
                </div>
            </div>
        </div>

        <div class="reminder-box">
            <span class="news-badge">📢 БОЛОВСРОЛ & СУРГУУЛИЙН МЭДЭЭ</span>
            <div class="ticker-wrapper">
                <div class="ticker-text" id="newsTicker">Мэдээлэл уншиж байна...</div>
            </div>
        </div>
    </footer>

    <div class="ble-status-box">
        <div class="ble-dot" id="bleDot"></div>
        <span id="bleText">BLE: Холбогдоогүй</span>
    </div>

    <div class="modal" id="adminModal">
        <div class="modal-content">
            <h2>⚙️ Сургуулийн Мэдээлэл Шинэчлэх (Neon SQL)</h2>
            <textarea id="schoolContextInput" placeholder="Энд сургуулийн хичээлийн танхим, анги танхимын байршил, ерөнхий мэдээллийг оруулна уу..."></textarea>
            <div class="btn-group">
                <button class="btn btn-secondary" onclick="closeAdmin()">Хаах</button>
                <button class="btn btn-primary" onclick="saveData()">Хадгалах</button>
            </div>
        </div>
    </div>

    <script>
        // Kiosk mode contextmenu & Touch hold prevention
        window.addEventListener('contextmenu', function (e) {
            e.preventDefault();
            e.stopPropagation();
            return false;
        }, true);

        const orbContainer = document.getElementById('orbContainer');
        const arrowOverlay = document.getElementById('arrowOverlay');
        const statusText = document.getElementById('statusText');
        const chatBox = document.getElementById('chatBox');
        const userQuestion = document.getElementById('userQuestion');
        const aiAnswer = document.getElementById('aiAnswer');
        const adminModal = document.getElementById('adminModal');
        const schoolContextInput = document.getElementById('schoolContextInput');
        
        const bleDot = document.getElementById('bleDot');
        const bleText = document.getElementById('bleText');

        let micStream = null;
        let mediaRecorder = null;
        let audioChunks = [];
        let isRecording = false;
        let isProcessing = false;
        let isSpeaking = false;
        let recordStartTime = 0;
        let hideChatTimeout = null;
        let currentBeaconAudio = null;

        function checkNetworkStatus() {
            if (!navigator.onLine) {
                orbContainer.classList.add('offline');
                statusText.innerHTML = "⚠️ Интернэт тасарлаа";
                return false;
            } else {
                orbContainer.classList.remove('offline');
                if (!isRecording && !isProcessing && !isSpeaking) {
                    statusText.innerHTML = "Дэлгэц дээр эсвэл <span class='key-badge'>SPACE</span> товчлуур дээр дарж яриарай";
                }
                return true;
            }
        }

        window.addEventListener('online', checkNetworkStatus);
        window.addEventListener('offline', checkNetworkStatus);
        setInterval(checkNetworkStatus, 3000);

        async function initMic() {
            if (!micStream) {
                try {
                    micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                } catch (e) {
                    console.log("Mic permission pending...");
                }
            }
        }
        window.addEventListener('click', initMic, { once: true });
        window.addEventListener('keydown', initMic, { once: true });
        window.addEventListener('touchstart', initMic, { once: true });

        function isBusy() {
            return isRecording || isProcessing || isSpeaking;
        }

        function showChat(question, answer) {
            chatBox.style.display = 'block';
            userQuestion.innerText = question;
            aiAnswer.innerText = answer;

            if (hideChatTimeout) {
                clearTimeout(hideChatTimeout);
            }

            hideChatTimeout = setTimeout(() => {
                chatBox.style.display = 'none';
            }, 15000);
        }

        function updateDateTime() {
            const now = new Date();
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');

            const daysMn = ['Ням', 'Даваа', 'Мягмар', 'Лхагва', 'Пүрэв', 'Баасан', 'Бямба'];
            const dayName = daysMn[now.getDay()];

            document.getElementById('timeDisplay').innerText = `${hours}:${minutes}:${seconds}`;
            document.getElementById('dateDisplay').innerText = `${year}.${month}.${day} (${dayName})`;
        }
        setInterval(updateDateTime, 1000);
        updateDateTime();

        function openAdmin() {
            const password = prompt("Тохиргоо руу нэвтрэх нууц үгээ оруулна уу:");
            if (password === "0614") {
                fetch('/api/school-data').then(res => res.json()).then(data => {
                    schoolContextInput.value = data.data || '';
                    adminModal.style.display = 'flex';
                });
            } else if (password !== null) {
                alert("❌ Нууц үг буруу байна!");
            }
        }

        function closeAdmin() { adminModal.style.display = 'none'; }

        function saveData() {
            fetch('/api/school-data', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ data: schoolContextInput.value })
            }).then(() => {
                alert("Neon PostgreSQL баазад амжилттай хадгалагдлаа!");
                closeAdmin();
            });
        }
    </script>
